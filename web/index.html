<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>NES Emulator</title>
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; width: 100%; height: 100%; }
		body { display: flex; flex-direction: column; font: 14px sans-serif; background: #111; }
		#loader { flex: none; padding: 12px; background: #fff; line-height: 1.6; }
		#rom { max-width: 100%; }
		#screen { position: relative; flex: 1; min-height: 0; overflow: hidden; }
		#webgl { display: block; width: 100%; height: 100%; }
	</style>
</head>

<body>
	<div id="loader">
		<label>Load NES ROM (mappers 0–4): <input id="rom" type="file" accept=".nes"></label>
		<div>Z: A · X: B · Shift: Select · Enter: Start · Arrow keys: Move</div>
	</div>
	<main id="screen"><canvas id="webgl" tabindex="0"></canvas></main>
	<script src="./emulator.js"></script>
</body>

</html>
